<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- 改這裡：頁面標題｜台灣犬圖鑑 -->
  <title>頁面標題｜台灣犬圖鑑</title>
  <meta name="description" content="一句話描述這一頁">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600&family=Noto+Serif+TC:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<!-- 改這裡：data-slug 等於檔名（不含 .html）；data-root 不要改 -->
<body data-slug="your-slug" data-root="../">
  <a class="skip-link" href="#content">跳到主要內容</a>
  <main id="content">

    <header class="page-hero">
      <span class="emoji" aria-hidden="true">🐾</span>
      <h1>頁面標題</h1>
      <p class="lede">一句話導言，告訴讀者這頁會讀到什麼。</p>
    </header>

    <section>
      <h2>第一個小節</h2>
      <p>內文段落，一段 3–5 句。</p>
    </section>

    <aside class="fact-box">
      <span class="label">小知識</span>
      <p>放一個關鍵數字或有趣事實。</p>
    </aside>

    <section>
      <h2>第二個小節</h2>
      <p>內文段落。</p>
    </section>

    <section class="sources">
      <h2>參考資料</h2>
      <ol>
        <li><a href="https://example.com">來源名稱</a></li>
      </ol>
    </section>

    <nav class="pager" id="pager" aria-label="上一頁與下一頁"></nav>
  </main>
  <script src="../assets/js/site.js"></script>
</body>
</html>
